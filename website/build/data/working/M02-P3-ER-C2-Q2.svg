<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 298" role="img"><rect width="440" height="298" fill="#fff"/><g font-family="Arial,sans-serif" fill="#222"><text x="18" y="28" font-size="22"><tspan x="18" dy="0">428 ÷ 7 — student’s working</tspan></text><text x="22" y="106" font-size="23"><tspan x="22" dy="0">7</tspan></text><path d="M75 116V78H221" fill="none" stroke="#555" stroke-width="2"/><text x="95" y="67" font-size="23"><tspan x="95" dy="0">0</tspan></text><text x="95" y="108" font-size="23"><tspan x="95" dy="0">4</tspan></text><text x="137" y="67" font-size="23"><tspan x="137" dy="0">6</tspan></text><text x="137" y="108" font-size="23"><tspan x="137" dy="0">2</tspan></text><text x="123" y="94" font-size="12"><tspan x="123" dy="0">4</tspan></text><text x="179" y="67" font-size="23"><tspan x="179" dy="0">2</tspan></text><text x="179" y="108" font-size="23"><tspan x="179" dy="0">8</tspan></text><text x="20" y="145" font-size="17"><tspan x="20" dy="0">4 ÷ 7 = 0 remainder 4</tspan></text><text x="20" y="170" font-size="17"><tspan x="20" dy="0">42 ÷ 7 = 6 remainder 0</tspan></text><text x="20" y="195" font-size="17"><tspan x="20" dy="0">8 ÷ 7 = 2 remainder 1</tspan></text><text x="20" y="228" font-size="15"><tspan x="20" dy="0">Student: 8 ÷ 7 gives 2 remainder 1.</tspan></text><text x="20" y="272" font-size="20"><tspan x="20" dy="0">Student’s answer: 62</tspan></text></g></svg>
