<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths practice · Solving equations</title><link rel="stylesheet" href="theme-tokens.css?v=20261003-2"><link rel="stylesheet" href="styles.css?v=20261003-2"><link rel="stylesheet" href="theme-controls.css?v=20261003-2"><script type="module" src="app.mjs?v=20261003-2"></script></head>
<body><a class="skip" href="#main">Skip to practice</a><header><a class="brand" href="#">Maths<span> / practice</span></a><div class="header-actions"><span id="welcome"></span><button id="profile-button" disabled>Choose name</button><div class="theme-controls">
      <button type="button" id="theme-picker" popovertarget="theme-menu" aria-label="Choose colour theme" title="Choose colour theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/></svg></button>

        <h2>Colour theme</h2>

      </div>
