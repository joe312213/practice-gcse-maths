<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="6 -4 332 317" width="249" height="237.75"><g font-family="Arial,sans-serif" fill="#222"><text x="18" y="28" font-size="22"><tspan x="18" dy="0">9,384 ÷ 48 — student’s working</tspan></text><text x="22" y="106" font-size="23"><tspan x="22" dy="0">48</tspan></text><path d="M75 116V78H263" fill="none" stroke="#555" stroke-width="2"/><text x="95" y="67" font-size="23"><tspan x="95" dy="0">0</tspan></text><text x="95" y="108" font-size="23"><tspan x="95" dy="0">9</tspan></text><text x="137" y="67" font-size="23"><tspan x="137" dy="0">0</tspan></text><text x="137" y="108" font-size="23"><tspan x="137" dy="0">3</tspan></text><text x="123" y="94" font-size="12"><tspan x="123" dy="0">9</tspan></text><text x="179" y="67" font-size="23"><tspan x="179" dy="0">2</tspan></text><text x="179" y="108" font-size="23"><tspan x="179" dy="0">8</tspan></text><text x="165" y="94" font-size="12"><tspan x="165" dy="0">12</tspan></text><text x="221" y="67" font-size="23"><tspan x="221" dy="0">6</tspan></text><text x="221" y="108" font-size="23"><tspan x="221" dy="0">4</tspan></text><text x="207" y="94" font-size="12"><tspan x="207" dy="0">32</tspan></text><text x="20" y="145" font-size="17"><tspan x="20" dy="0">9 ÷ 48 = 0 remainder 9</tspan></text><text x="20" y="170" font-size="17"><tspan x="20" dy="0">12 ÷ 48 = 0 remainder 12</tspan></text><text x="20" y="195" font-size="17"><tspan x="20" dy="0">128 ÷ 48 = 2 remainder 32</tspan></text><text x="20" y="220" font-size="17"><tspan x="20" dy="0">324 ÷ 48 = 6 remainder 36</tspan></text><text x="20" y="253" font-size="15"><tspan x="20" dy="0">Student: add carried 9 to digit 3 instead of</tspan><tspan x="20" dy="19">making 93.</tspan></text><text x="20" y="297" font-size="20"><tspan x="20" dy="0">Student’s answer: 26.75</tspan></text></g></svg>
